<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <div id="scoreBoard">SCORE: <span id="scoreEl">0</span></div>
        <div id="roundBoard">RONDA: <span id="roundEl">1</span></div>
        <div id="instructions">
            <div class="control-group">
                <span class="keys">
                    <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
                </span>
                <span class="desc">Moverse</span>
            </div>
            <div class="control-group">
                <span class="keys">
                    <span class="key">Click Izq</span>
                </span>
                <span class="desc">Disparar</span>
            </div>
            <div class="control-group">
                <span class="keys">
                    <span class="key space">Espacio</span>
                </span>
                <span class="desc">Escudo</span>
            </div>
            <div class="control-group">
                <span class="keys">
                    <span class="key">Shift</span>
                </span>
                <span class="desc">Teletransporte</span>
            </div>
        </div>
        <div id="gameOverModal">
            <h1>GAME OVER</h1>
            <p>SCORE: <span id="finalScore">0</span></p>
            <button id="restartBtn">RESTART</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
